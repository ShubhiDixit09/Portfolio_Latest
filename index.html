    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      (function() {
        var saved = localStorage.getItem('portfolio-theme') || 'light';
        var valid = ['light','dark','ocean','sunset','forest','rose'];
        document.documentElement.setAttribute('data-theme', valid.includes(saved) ? saved : 'light');
      })();
